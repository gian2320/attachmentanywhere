  <style>
    /* OLED Clean Custom Scrollbar */
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #d4d4d8; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #a1a1aa; }

    /* Hide horizontal scrollbar for mobile thumb snap dock */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* Remove tap flash and touch highlights globally */
    * { -webkit-tap-highlight-color: transparent; }

    /* Touch action optimization: allows smooth vertical scrolling while scrubbing */
    body, #avatar-container { touch-action: pan-y; }

    /* Safe area insets for notches, dynamic islands, and home indicators */
    .safe-insets {
      padding-top: max(1rem, env(safe-area-inset-top));
      padding-bottom: max(1.25rem, env(safe-area-inset-bottom));
      padding-left: max(1rem, env(safe-area-inset-left));
      padding-right: max(1rem, env(safe-area-inset-right));
    }

    /* Stage card animations */
    .stage-enter {
      animation: stageSlideUp 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes stageSlideUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Optical Centering & Smooth Dynamic Expansion */
    #main-container {
      transition: min-height 0.4s ease-out, padding 0.4s ease-out;
    }
    #main-container.active-stage {
      justify-content: flex-start;
      padding-top: max(1.25rem, env(safe-area-inset-top));
      padding-bottom: max(2rem, env(safe-area-inset-bottom));
    }

    #interactive-stage {
      transition: max-height 0.45s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.35s ease, margin 0.35s ease;
    }
    #interactive-stage.stage-open {
      max-height: 42dvh;
      opacity: 1;
      pointer-events: auto;
      margin-top: 1.25rem;
      margin-bottom: 1rem;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    @media (min-width: 640px) {
      #interactive-stage.stage-open {
        max-height: 520px;
      }
    }
    #interactive-stage::-webkit-scrollbar { width: 4px; }
    #interactive-stage::-webkit-scrollbar-track { background: transparent; }
    #interactive-stage::-webkit-scrollbar-thumb { background: #d4d4d8; border-radius: 9999px; }

    /* Virtual Keyboard Open Adaptation (Prevents Mobile Flex Squashing) */
    .keyboard-open #avatar-container {
      width: 3.5rem !important;
      height: 3.5rem !important;
      margin-top: 0.25rem !important;
      margin-bottom: 0.25rem !important;
    }
    .keyboard-open #hero-header {
      display: none !important;
    }
    .keyboard-open #suggestion-chips {
      display: none !important;
    }
    .keyboard-open #interactive-stage.stage-open {
      max-height: 25dvh !important;
    }
  </style>
</head>

    /* =========================================================================
       2. CRITICAL FIX: LAG-FREE MEMOJI PRELOADER ENGINE (Full In-Memory Cache)
       ========================================================================= */
    const totalFrames = 84;
    let currentFrame = 48; // Frame 48 faces straight forward
    let targetFrame = 48;
    let lastRenderedFrame = 48;
    const avatarImg = document.getElementById("avatar-img");

    // 1. Full In-Memory Cache: Load all 84 images immediately
    const frameCache = new Array(totalFrames);
    for (let i = 0; i < totalFrames; i++) {
      const padded = String(i).padStart(2, "0");
      const img = new Image();
      img.src = `avatar/frame_${padded}_delay-0.05s.webp`;
      frameCache[i] = img;
    }

    // 2. Instant Center Mount: set base frame without delay
    if (avatarImg) {
      avatarImg.src = "avatar/frame_48_delay-0.05s.webp";
    }

    // Helper: Map screen X coordinate (0 to 1) to frame index (0 to 83)
    function handlePointerCoord(clientX) {
      if (typeof clientX !== "number" || isNaN(clientX) || window.innerWidth <= 0) return;
      const ratio = Math.max(0, Math.min(1, clientX / window.innerWidth));
      targetFrame = Math.round(ratio * (totalFrames - 1));
    }

    // Passive mouse and touch event listeners
    window.addEventListener("mousemove", (e) => {
      handlePointerCoord(e.clientX);
    }, { passive: true });

    window.addEventListener("touchstart", (e) => {
      if (e.touches && e.touches[0]) {
        handlePointerCoord(e.touches[0].clientX);
      }
    }, { passive: true });

    window.addEventListener("touchmove", (e) => {
      if (e.touches && e.touches[0]) {
        handlePointerCoord(e.touches[0].clientX);
      }
    }, { passive: true });

    // Smooth return to neutral center on leave or touch release
    document.addEventListener("mouseleave", () => {
      targetFrame = 48;
    });

    window.addEventListener("touchend", () => {
      setTimeout(() => { targetFrame = 48; }, 850);
    }, { passive: true });

    window.addEventListener("touchcancel", () => {
      targetFrame = 48;
    }, { passive: true });

    // DeviceOrientation Parallax on mobile with deadzone clamp
    if (window.DeviceOrientationEvent) {
      window.addEventListener("deviceorientation", (e) => {
        if (e.gamma !== null && e.gamma !== undefined && !isNaN(e.gamma)) {
          if (Math.abs(e.gamma) < 2) return;
          const clamped = Math.max(-25, Math.min(25, e.gamma));
          const ratio = (clamped + 25) / 50;
          targetFrame = Math.round(ratio * (totalFrames - 1));
        }
      }, { passive: true });
    }

    // 4. RequestAnimationFrame Lerp Damping Loop (Damping factor 0.22, Throttled Mutation)
    function animateAvatar() {
      const diff = targetFrame - currentFrame;
      if (Math.abs(diff) > 0.02) {
        currentFrame += diff * 0.22;
      } else {
        currentFrame = targetFrame;
      }

      const roundedIndex = Math.max(0, Math.min(totalFrames - 1, Math.round(currentFrame)));

      // Throttling: Only mutate avatarImg.src when the rounded integer index actually changes
      if (roundedIndex !== lastRenderedFrame) {
        lastRenderedFrame = roundedIndex;
        // Zero Network Scrubbing: read exclusively from frameCache
        if (frameCache[roundedIndex] && frameCache[roundedIndex].src) {
          avatarImg.src = frameCache[roundedIndex].src;
        }
      }

      requestAnimationFrame(animateAvatar);
    }
    requestAnimationFrame(animateAvatar);


    /* =========================================================================
       3. VIRTUAL KEYBOARD & VIEWPORT ADAPTATION (Android, Huawei & iOS)
       ========================================================================= */

    const interactiveStage = document.getElementById("interactive-stage");
    const stageContent = document.getElementById("stage-content");
    const promptDock = document.getElementById("prompt-dock");

    function handleViewportResize() {
      if (!window.visualViewport) return;
      const height = window.visualViewport.height;
      const fullHeight = window.innerHeight;

      // Virtual keyboard active when viewport height shrinks significantly
      const isKeyboardOpen = height < fullHeight * 0.76;
      if (isKeyboardOpen) {
        mainContainer.classList.add("keyboard-open");
        setTimeout(() => {
          promptDock.scrollIntoView({ behavior: "smooth", block: "end" });
        }, 80);
      } else {
        mainContainer.classList.remove("keyboard-open");
      }
    }

    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", handleViewportResize);
      window.visualViewport.addEventListener("scroll", handleViewportResize);
    }

      div.textContent = text;
      return div.innerHTML;

              <p class="text-xs font-semibold text-neutral-600">${escapeHtml(exp.org)}</p>

      stack: () => {
        const groupsHtml = GIAN_DATA.stack.map(g => `

            </div>

        return `
          <div class="space-y-4">

      contact: () => {
        const c = GIAN_DATA.contact;
        const linksHtml = c.links.map(l => {
          const isPrimary = l.label.toLowerCase().includes("order");
          const href = l.url;
          return `
            <a href="${href}" target="${href.startsWith('http') ? '_blank' : '_self'}" rel="${href.startsWith('http') ? 'noopener noreferrer' : ''}" class="${isPrimary ? 'bg-black text-white hover:bg-neutral-800' : 'border border-neutral-300 bg-white hover:border-black text-neutral-800'} text-xs font-bold uppercase tracking-widest px-5 py-3 rounded-xl inline-flex items-center justify-center gap-2 transition-all active:scale-95 flex-1 min-w-[140px] text-center cursor-pointer shadow-xs">
              <i data-lucide="${escapeHtml(l.icon)}" class="w-4 h-4"></i>

        }).join('');

        return `
          <div class="bg-white p-6 sm:p-8 rounded-3xl border border-neutral-200/90 shadow-[0_12px_40px_rgba(0,0,0,0.06)]">
            <h3 class="text-base sm:text-lg font-bold text-neutral-900 mb-2">Get in Touch</h3>

            <div class="flex flex-wrap gap-3 mb-6">

      mindset: () => {
        const m = GIAN_DATA.mindset;
        const principlesHtml = m.principles.map(p => `
          <div class="p-4 sm:p-5 rounded-2xl bg-[#f8f9fa] border border-neutral-200">
            <h5 class="text-xs font-bold text-neutral-900 mb-1">${escapeHtml(p.title)}</h5>

          </div>
        `).join('');

        const hobbiesHtml = GIAN_DATA.hobbies.map(h => `
          <li class="flex items-start gap-3 text-xs sm:text-sm text-neutral-600 font-light leading-relaxed">
            <span class="w-1.5 h-1.5 rounded-full bg-neutral-400 shrink-0 mt-2"></span>
            <span>${escapeHtml(h)}</span>
          </li>

        return `
          <div class="space-y-4">
            <div class="bg-[#0a0a0c] text-white p-6 sm:p-8 rounded-3xl border border-neutral-900 shadow-xl">
              <blockquote class="text-base sm:text-lg font-medium leading-relaxed text-neutral-100">
                &ldquo;${escapeHtml(m.quote)}&rdquo;
              </blockquote>
            </div>

            <div class="bg-white p-6 sm:p-7 rounded-3xl border border-neutral-200/90 shadow-[0_12px_40px_rgba(0,0,0,0.06)]">
              <h4 class="text-sm sm:text-base font-bold text-neutral-900 mb-3.5">Operating Principles</h4>
              <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                ${principlesHtml}
              </div>
            </div>

            <div class="bg-white p-6 sm:p-7 rounded-3xl border border-neutral-200/90 shadow-[0_12px_40px_rgba(0,0,0,0.06)]">
              <h4 class="text-sm sm:text-base font-bold text-neutral-900 mb-3.5">Interests &amp; Offline</h4>
              <ul class="space-y-2.5">
                ${hobbiesHtml}
              </ul>
            </div>
          </div>
        `;
      },

      fallback: () => `
        <div class="bg-white p-6 sm:p-8 rounded-3xl border border-neutral-200/90 shadow-[0_12px_40px_rgba(0,0,0,0.06)]">
          <h3 class="text-base sm:text-lg font-bold text-neutral-900 mb-2">Explore Gian's Universe</h3>
          <p class="text-neutral-600 text-xs sm:text-sm font-light leading-relaxed mb-6">
            Gian Villanueva manufactures custom contactless NFC cards and audits national healthcare database systems. Select a topic or ask a question:
          </p>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <button onclick="handleSuggestion('NFC Products')" class="text-left p-4 rounded-2xl bg-[#f8f9fa] hover:bg-[#f1f3f5] border border-neutral-200 transition-all cursor-pointer"><div class="text-xs font-bold text-neutral-900 mb-1">NFC Products &amp; Cards</div><div class="text-xs text-neutral-500 font-light">Custom contactless cards and Google review stands.</div></button>
            <button onclick="handleSuggestion('Experience')" class="text-left p-4 rounded-2xl bg-[#f8f9fa] hover:bg-[#f1f3f5] border border-neutral-200 transition-all cursor-pointer"><div class="text-xs font-bold text-neutral-900 mb-1">Experience &amp; DOH</div><div class="text-xs text-neutral-500 font-light">National health data encoding and creator projects.</div></button>
            <button onclick="handleSuggestion('Tools &amp; Systems')" class="text-left p-4 rounded-2xl bg-[#f8f9fa] hover:bg-[#f1f3f5] border border-neutral-200 transition-all cursor-pointer"><div class="text-xs font-bold text-neutral-900 mb-1">Tools &amp; Systems</div><div class="text-xs text-neutral-500 font-light">AI ecosystems, NFC hardware, and web automation tools.</div></button>
            <button onclick="handleSuggestion('Contact')" class="text-left p-4 rounded-2xl bg-[#f8f9fa] hover:bg-[#f1f3f5] border border-neutral-200 transition-all cursor-pointer"><div class="text-xs font-bold text-neutral-900 mb-1">Contact &amp; Orders</div><div class="text-xs text-neutral-500 font-light">Direct Instagram, Messenger, and references.</div></button>
          </div>
        </div>
      `,

      queryWrapper: (prompt, note, innerHtml) => `
        <div class="space-y-4">
          <div class="p-4 sm:p-5 rounded-2xl bg-white border border-neutral-200/90 shadow-[0_8px_30px_rgba(0,0,0,0.06)] flex items-start justify-between gap-4">
            <div class="space-y-1">
              <p class="text-xs font-mono text-neutral-400">&ldquo;${escapeHtml(prompt)}&rdquo;</p>
              <p class="text-xs sm:text-sm text-neutral-800 font-medium leading-relaxed">${escapeHtml(note)}</p>
            </div>
            <button onclick="dismissStage()" title="Close stage" class="p-1 rounded-full hover:bg-neutral-100 text-neutral-400 hover:text-neutral-800 transition-colors shrink-0 cursor-pointer">
              <i data-lucide="x" class="w-4 h-4"></i>
            </button>
          </div>
          <div>
            ${innerHtml}
          </div>
        </div>
      `
    };

    function renderStage(prompt, note, tabKey) {
      mainContainer.classList.add("active-stage");
      interactiveStage.classList.remove("max-h-0", "opacity-0", "pointer-events-none");
      interactiveStage.classList.add("stage-open");

      stageContent.classList.remove("stage-enter");
      void stageContent.offsetWidth; // Force Reflow
      const innerHtml = STAGE_TEMPLATES[tabKey] ? STAGE_TEMPLATES[tabKey]() : STAGE_TEMPLATES.fallback();
      stageContent.innerHTML = STAGE_TEMPLATES.queryWrapper(prompt, note, innerHtml);
      stageContent.classList.add("stage-enter");
      lucide.createIcons();

      // Smooth scroll into stage view
      setTimeout(() => {
        interactiveStage.scrollIntoView({ behavior: "smooth", block: "nearest" });
      }, 50);
    }

    function dismissStage() {
      interactiveStage.classList.remove("stage-open");
      interactiveStage.classList.add("max-h-0", "opacity-0", "pointer-events-none");
      mainContainer.classList.remove("active-stage");
      setTimeout(() => {
        stageContent.innerHTML = "";
      }, 400);
    }


    /* =========================================================================
       5. DIGITAL TWIN QUERY PARSER ENGINE
       ========================================================================= */
    const promptInput = document.getElementById("prompt-input");

    function hasAny(targetStr, keywords) {
      return keywords.some(k => targetStr.includes(k));
    }

    function handleQuery(rawText) {
      if (!rawText || !rawText.trim()) return;
      const q = rawText.trim().toLowerCase();

      // Bio / Background
      if (hasAny(q, ["who", "gian", "gi", "about", "student", "letran", "story", "origin", "bio", "founder", "talk"])) {
        renderStage(rawText, "Here is Gian's core profile and background.", "me");
      }
      // Projects & NFC Products
      else if (hasAny(q, ["attachment", "nfc", "cards", "card", "review", "stands", "stand", "projects", "project", "builds", "build", "pricing", "price", "rates"])) {
        renderStage(rawText, "Here are Gian's custom NFC cards, review stands, and physical builds.", "projects");
      }
      // Work & Experience
      else if (hasAny(q, ["experience", "doh", "gip", "health", "encoder", "encoding", "whop", "clipping", "involve", "jobs", "work", "job", "intern", "timeline", "operations"])) {
        renderStage(rawText, "Here is Gian's experience as a DOH national health data encoder, at Letran, and across creator projects.", "experience");
      }
      // Stack & Tools
      else if (hasAny(q, ["tools", "systems", "system", "hardware", "platforms", "platform", "stack", "apps", "app", "dev", "software", "tech", "gemini", "antigravity", "opal"])) {
        renderStage(rawText, "Here are Gian's active platforms, hardware workflows, and web automation tools.", "stack");
      }
      // Contact & Orders
      else if (hasAny(q, ["contact", "hire", "order", "rates", "inquire", "socials", "social", "reference", "references", "instagram", "messenger", "reach", "email", "phone"])) {
        renderStage(rawText, "Here are direct channels to get in touch, order products, or request verified references.", "contact");
      }
      // Mindset & Principles
      else if (hasAny(q, ["mindset", "philosophy", "principles", "principle", "hobby", "hobbies", "interests", "interest", "basketball", "sci-fi"])) {
        renderStage(rawText, "Here are Gian's operating principles and offline interests.", "mindset");
      }
      // Fallback
      else {
        renderStage(
          rawText,
          "Gian Villanueva manufactures contactless smart cards and builds AI tools. Select a category below or ask a specific question:",
          "fallback"
        );
      }
    }

    function handleQuerySubmit(e) {
      if (e) e.preventDefault();
      const rawText = promptInput.value.trim();
      if (!rawText) return;
      promptInput.value = "";
      handleQuery(rawText);
    }

    function handleSuggestion(text) {
      promptInput.value = text;
      handleQuery(text);
    }

    // Auto-focus input on desktop load
    window.addEventListener("DOMContentLoaded", () => {
      lucide.createIcons();
      if (window.innerWidth >= 768 && promptInput) {
        promptInput.focus();
      }
    });


    /* =========================================================================
       6. BLACK & WHITE GLITTER CANVAS CURSOR ENGINE (Light Mode Obsidian-Starlight)
       ========================================================================= */
    (function initGlitterBlackAndWhiteCursor() {
      const canvas = document.getElementById("cursor-canvas");
      if (!canvas) return;
      const ctx = canvas.getContext("2d");

      let width = (canvas.width = window.innerWidth);
      let height = (canvas.height = window.innerHeight);

      window.addEventListener("resize", () => {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      }, { passive: true });

      const isCoarsePointer = window.matchMedia("(pointer: coarse)").matches;
      const particles = [];
      const shockwaves = [];
      let animId = null;

      // Particle palette: Crisp obsidian blacks, charcoal, platinum, and brilliant diamond white with halo contrast
      const GLITTER_SPECS = [
        { color: "rgba(10, 10, 12,", shadow: "rgba(0, 0, 0, 0.4)", isWhite: false },     // Pure obsidian black
        { color: "rgba(24, 24, 27,", shadow: "rgba(0, 0, 0, 0.3)", isWhite: false },     // Charcoal void
        { color: "rgba(71, 85, 105,", shadow: "rgba(30, 41, 59, 0.3)", isWhite: false },  // Slate graphite
        { color: "rgba(148, 163, 184,", shadow: "rgba(0, 0, 0, 0.25)", isWhite: false }, // Metallic silver/platinum
        { color: "rgba(255, 255, 255,", shadow: "rgba(0, 0, 0, 0.55)", isWhite: true },  // Diamond white shimmer (with dark halo shadow)
        { color: "rgba(248, 250, 252,", shadow: "rgba(15, 23, 42, 0.45)", isWhite: true } // Icy starlight white
      ];

      class Shockwave {
        constructor(x, y) {
          this.x = x;
          this.y = y;
          this.radius = 6;
          this.maxRadius = isCoarsePointer ? 45 : 65;
          this.life = 1.0;
          this.decay = isCoarsePointer ? 0.055 : 0.045;
        }
        update() {
          this.radius += (this.maxRadius - this.radius) * 0.2;
          this.life -= this.decay;
        }
        draw(ctx) {
          if (this.life <= 0) return;
          ctx.save();
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
          ctx.strokeStyle = `rgba(15, 23, 42, ${this.life * 0.35})`;
          ctx.lineWidth = 1.2;
          ctx.shadowColor = "rgba(0, 0, 0, 0.25)";
          ctx.shadowBlur = 4;
          ctx.stroke();
          ctx.restore();
        }
      }

      class GlitterParticle {
        constructor(x, y, isBurst = false) {
          this.x = x + (Math.random() - 0.5) * 6;
          this.y = y + (Math.random() - 0.5) * 6;
          const speed = isBurst ? Math.random() * 4.4 + 1.6 : Math.random() * 1.6 + 0.4;
          const angle = Math.random() * Math.PI * 2;
          this.vx = Math.cos(angle) * speed;
          this.vy = Math.sin(angle) * speed;
          this.size = Math.random() * 2.6 + 0.9;
          this.life = 1.0;
          this.decay = isBurst ? Math.random() * 0.038 + 0.024 : Math.random() * 0.018 + 0.014;
          this.spec = GLITTER_SPECS[Math.floor(Math.random() * GLITTER_SPECS.length)];
          this.twinkleSpeed = Math.random() * 16 + 10;
          this.isSparkleCross = Math.random() > 0.65; // 35% chance for 4-point star glint
        }
        update() {
          this.x += this.vx;
          this.y += this.vy;
          this.vx *= 0.95;
          this.vy *= 0.95;
          this.life -= this.decay;
        }
        draw(ctx, masterAlpha = 1) {
          if (this.life <= 0) return;
          const twinkle = Math.abs(Math.sin(this.life * this.twinkleSpeed));
          const alpha = Math.max(0, Math.min(1, this.life * twinkle * masterAlpha));

          ctx.save();
          ctx.fillStyle = `${this.spec.color} ${alpha})`;
          ctx.shadowColor = this.spec.shadow;
          ctx.shadowBlur = this.spec.isWhite ? this.size * 3 : this.size * 1.5;

          if (this.isSparkleCross && this.life > 0.35) {
            const len = this.size * 2.3;
            // Draw cross star glint
            ctx.beginPath();
            ctx.moveTo(this.x, this.y - len);
            ctx.lineTo(this.x, this.y + len);
            ctx.moveTo(this.x - len, this.y);
            ctx.lineTo(this.x + len, this.y);
            ctx.strokeStyle = `${this.spec.color} ${Math.min(1, alpha * 1.3)})`;
            ctx.lineWidth = this.spec.isWhite ? 1.0 : 0.8;
            ctx.stroke();
          } else {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
            if (this.spec.isWhite) {
              // Fine dark core ring so white glitter contrasts perfectly on white bg
              ctx.strokeStyle = `rgba(0, 0, 0, ${alpha * 0.35})`;
              ctx.lineWidth = 0.5;
              ctx.stroke();
            }
          }
          ctx.restore();
        }
      }

      /* --- MOBILE COARSE POINTER: Tap Burst Shockwave Engine --- */
      if (isCoarsePointer) {
        function triggerMobileBurst(x, y) {
          shockwaves.push(new Shockwave(x, y));
          const burstCount = Math.floor(Math.random() * 6) + 14;
          for (let i = 0; i < burstCount; i++) {
            if (particles.length < 55) {
              particles.push(new GlitterParticle(x, y, true));
            }
          }
          if (!animId) startTouchLoop();
        }

        function touchLoop() {
          ctx.clearRect(0, 0, width, height);

          for (let i = shockwaves.length - 1; i >= 0; i--) {
            shockwaves[i].update();
            shockwaves[i].draw(ctx);
            if (shockwaves[i].life <= 0) shockwaves.splice(i, 1);
          }

          for (let i = particles.length - 1; i >= 0; i--) {
            particles[i].update();
            particles[i].draw(ctx, 1);
            if (particles[i].life <= 0) particles.splice(i, 1);
          }

          if (shockwaves.length > 0 || particles.length > 0) {
            animId = requestAnimationFrame(touchLoop);
          } else {
            animId = null;
          }
        }

        function startTouchLoop() {
          if (!animId) animId = requestAnimationFrame(touchLoop);
        }

        window.addEventListener("touchstart", (e) => {
          if (e.touches && e.touches[0]) {
            triggerMobileBurst(e.touches[0].clientX, e.touches[0].clientY);
          }
        }, { passive: true });

        return;
      }

      /* --- DESKTOP FINE POINTER: Continuous 60 FPS Trail Engine --- */
      const mouse = { x: width / 2, y: height / 2, moved: false };
      const trail = { x: width / 2, y: height / 2 };
      let lastMoveTime = Date.now();
      let masterAlpha = 0;

      window.addEventListener("mousemove", (e) => {
        mouse.x = e.clientX;
        mouse.y = e.clientY;
        mouse.moved = true;
        lastMoveTime = Date.now();

        // Spawn micro stardust glitter specks per move event (alternating black and white)
        if (particles.length < 120) {
          const count = Math.floor(Math.random() * 3) + 2;
          for (let i = 0; i < count; i++) {
            particles.push(new GlitterParticle(mouse.x, mouse.y));
          }
        }
      }, { passive: true });

      // Click burst: spawn explosive black & white glitter radiating outward
      window.addEventListener("mousedown", (e) => {
        lastMoveTime = Date.now();
        shockwaves.push(new Shockwave(e.clientX, e.clientY));
        const burstCount = 22;
        for (let i = 0; i < burstCount; i++) {
          if (particles.length < 140) {
            particles.push(new GlitterParticle(e.clientX, e.clientY, true));
          }
        }
      }, { passive: true });

      function desktopLoop() {
        ctx.clearRect(0, 0, width, height);

        const isIdle = Date.now() - lastMoveTime > 700;
        masterAlpha += ((isIdle ? 0 : 1) - masterAlpha) * 0.12;

        trail.x += (mouse.x - trail.x) * 0.22;
        trail.y += (mouse.y - trail.y) * 0.22;

        if (masterAlpha > 0.01 && mouse.moved) {
          // Ambient soft graphite/mist stardust glow under cursor
          const radial = ctx.createRadialGradient(trail.x, trail.y, 0, trail.x, trail.y, 36);
          radial.addColorStop(0, `rgba(15, 23, 42, ${0.08 * masterAlpha})`);
          radial.addColorStop(0.35, `rgba(71, 85, 105, ${0.05 * masterAlpha})`);
          radial.addColorStop(0.7, `rgba(203, 213, 225, ${0.04 * masterAlpha})`);
          radial.addColorStop(1, "transparent");
          ctx.fillStyle = radial;
          ctx.beginPath();
          ctx.arc(trail.x, trail.y, 36, 0, Math.PI * 2);
          ctx.fill();
        }

        // Draw and update shockwaves
        for (let i = shockwaves.length - 1; i >= 0; i--) {
          shockwaves[i].update();
          shockwaves[i].draw(ctx);
          if (shockwaves[i].life <= 0) shockwaves.splice(i, 1);
        }

        // Update and draw particles
        for (let i = particles.length - 1; i >= 0; i--) {
          particles[i].update();
          particles[i].draw(ctx, masterAlpha);
          if (particles[i].life <= 0) particles.splice(i, 1);
        }

        requestAnimationFrame(desktopLoop);
      }

      requestAnimationFrame(desktopLoop);
    })();
  </script>
