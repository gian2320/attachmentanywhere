    <!-- FontAwesome for clean icons -->

    <!-- Google Fonts: Montserrat & Archivo Black -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

        .ig-button:hover {

<body class="min-h-screen flex items-center justify-center p-4">

                <i class="fa-solid fa-qrcode text-xs"></i> Show QR
            </button>
        </div>

        <hr class="border-gray-100 mb-6">

        <!-- Links & Buttons List -->
        <div class="space-y-3">

            <a href="tel:+6390947801497" class="flex items-center justify-between p-3.5 rounded-2xl bg-gray-50 border border-gray-100 ig-button group">

                        <i class="fa-solid fa-phone"></i>

                    <div>

                        <div class="text-xs text-gray-500">0909 478 01497</div>
                    </div>
                </div>
                <i class="fa-solid fa-chevron-right text-xs text-gray-400"></i>
            </a>

            <!-- Viber -->
            <a href="viber://chat?number=639173600400" class="flex items-center justify-between p-3.5 rounded-2xl bg-gray-50 border border-gray-100 ig-button group">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-white flex items-center justify-center text-purple-600 shadow-sm border border-gray-100">

                    </div>
                    <div>
                        <div class="text-sm font-semibold text-gray-900">Viber</div>
                        <div class="text-xs text-gray-500">0917 360 0400</div>

            <!-- Facebook -->
            <a href="https://m.facebook.com/dktj.ktj.flaviano/" target="_blank" rel="noopener noreferrer" class="flex items-center justify-between p-3.5 rounded-2xl bg-gray-50 border border-gray-100 ig-button group">
                <div class="flex items-center gap-3">

                        <div class="text-xs text-gray-500">View Facebook Profile</div>
                    </div>
                </div>
                <i class="fa-solid fa-chevron-right text-xs text-gray-400"></i>
            </a>

            <!-- Google Mail -->
            <a href="https://mail.google.com/mail/?view=cm&fs=1&to=khimflaviano123@gmail.com" target="_blank" rel="noopener noreferrer" class="flex items-center justify-between p-3.5 rounded-2xl bg-gray-50 border border-gray-100 ig-button group">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-white flex items-center justify-center shadow-sm border border-gray-100">
                        <svg class="w-4 h-4" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
                    </div>
                    <div>
                        <div class="text-sm font-semibold text-gray-900">Google Mail</div>

        <!-- Footer Branding -->

    </div>

    <!-- QR Code Modal -->
    <div id="qrModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-white rounded-3xl p-6 max-w-xs w-full text-center shadow-xl relative animate-in fade-in zoom-in duration-200">
            <button onclick="toggleQRModal()" class="absolute top-4 right-4 text-gray-400 hover:text-black cursor-pointer">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
            <h3 class="text-base font-bold text-gray-900 mb-1">Scan to Connect</h3>
            <p class="text-xs text-gray-500 mb-4">Point your camera to view this card</p>
            <div id="qrcode" class="flex justify-center p-2 bg-gray-50 rounded-2xl border border-gray-100 mb-4"></div>
            <button onclick="toggleQRModal()" class="w-full bg-gray-100 text-gray-800 text-xs font-semibold py-2.5 rounded-xl cursor-pointer">Close</button>
        </div>
    </div>

    <!-- Scripts for vCard & QR Generation -->
    <script>
        function downloadVCard() {
            const vcardData = `BEGIN:VCARD
VERSION:3.0
FN:Bernard Sabalza
N:Sabalza;Bernard;;;
TITLE:Salesman | DYKTJ Auto Supply
ORG:DYKTJ Auto Supply
TEL;TYPE=CELL:+6390947801497
TEL;TYPE=WORK:+639173600400
EMAIL:khimflaviano123@gmail.com
URL:${window.location.href}
END:VCARD`;

            const blob = new Blob([vcardData], { type: 'text/vcard;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.setAttribute('download', 'Bernard_Sabalza.vcf');
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }

        // Initialize QR Code generator
        const qrContainer = document.getElementById("qrcode");
        const currentUrl = window.location.href;
        new QRCode(qrContainer, {
            text: currentUrl,
            width: 180,
            height: 180,
            colorDark: "#000000",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.H
        });

        // Toggle QR Modal
        function toggleQRModal() {
            const modal = document.getElementById('qrModal');
            modal.classList.toggle('hidden');
            modal.classList.toggle('flex');
        }
    </script>
</body>
</html>
