    <script>
        // 1. Contact Photo Base64 Extraction & Caching for vCard
        let cachedPhotoBase64 = null;

        async function getProfilePhotoBase64() {
            if (cachedPhotoBase64) return cachedPhotoBase64;

            try {
                const res = await fetch('Sophia Abigael De Guzman.jpg');
                if (res.ok) {
                    const blob = await res.blob();
                    const base64 = await new Promise((resolve, reject) => {
                        const reader = new FileReader();
                        reader.onloadend = () => {
                            if (typeof reader.result === 'string') {
                                resolve(reader.result.split(',')[1]);
                            } else {
                                reject(new Error('Invalid blob reader output'));
                            }
                        };
                        reader.onerror = reject;
                        reader.readAsDataURL(blob);
                    });
                    if (base64) {
                        cachedPhotoBase64 = base64;
                        return cachedPhotoBase64;
                    }
                }
            } catch (err) {}

            return new Promise((resolve) => {
                const img = new Image();
                img.crossOrigin = 'Anonymous';
                img.onload = () => {
                    try {
                        const canvas = document.createElement('canvas');
                        const maxDim = 320;
                        let w = img.naturalWidth || img.width || 300;
                        let h = img.naturalHeight || img.height || 300;
                        if (w > maxDim || h > maxDim) {
                            if (w > h) {
                                h = Math.round((h * maxDim) / w);
                                w = maxDim;
                            } else {
                                w = Math.round((w * maxDim) / h);
                                h = maxDim;
                            }
                        }
                        canvas.width = w;
                        canvas.height = h;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, w, h);
                        const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
                        cachedPhotoBase64 = dataUrl.split(',')[1];
                        resolve(cachedPhotoBase64);
                    } catch (e) {
                        resolve(null);
                    }
                };
                img.onerror = () => resolve(null);
                img.src = 'Sophia Abigael De Guzman.jpg';
            });
        }

        if (typeof window !== 'undefined') {
            setTimeout(getProfilePhotoBase64, 400);
        }

        // 2. Generate vCard with Native Photo Embedding
        async function downloadVCard() {
            let photoPayload = '';
            try {
                const photoBase64 = await getProfilePhotoBase64();
                if (photoBase64) {
                    photoPayload = `\nPHOTO;ENCODING=b;TYPE=JPEG:${photoBase64}`;
                }
            } catch (e) {
                photoPayload = '';
            }

            const vcardData = `BEGIN:VCARD
VERSION:3.0
FN:Sophia Abigael De Guzman
N:De Guzman;Sophia;Abigael;;
TITLE:Co-Founder
ORG:Attachment Anywhere
TEL;TYPE=CELL:+639476979312
EMAIL:Sdeguzman247@gmail.com
URL:https://attachmentanywhere.com/aa260908072405.html${photoPayload}
END:VCARD`;

            const dataUri = 'data:text/vcard;charset=utf-8,' + encodeURIComponent(vcardData);
            const link = document.createElement('a');
            link.href = dataUri;
            link.setAttribute('download', 'Sophia_De_Guzman.vcf');
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // 3. Native Web Share API + Clean Toast Fallback
        let toastTimer;
        function showToast(message = "Link copied to clipboard!") {
            const toast = document.getElementById("toast");
            const toastMsg = document.getElementById("toast-msg");
            if (!toast || !toastMsg) return;

            toastMsg.textContent = message;
            toast.classList.remove("opacity-0", "translate-y-3", "pointer-events-none");
            toast.classList.add("opacity-100", "translate-y-0", "pointer-events-auto");

            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toast.classList.remove("opacity-100", "translate-y-0", "pointer-events-auto");
                toast.classList.add("opacity-0", "translate-y-3", "pointer-events-none");
            }, 2000);
        }

        async function shareProfile() {
            const shareData = {
                title: document.title || 'Sophia Abigael De Guzman | Digital Calling Card',
                text: 'Digital Calling Card of Sophia Abigael De Guzman',
                url: window.location.href
            };

            if (navigator.share) {
                try {
                    await navigator.share(shareData);
                    return;
                } catch (err) {
                    if (err.name === 'AbortError') return;
                }
            }

            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(window.location.href)
                    .then(() => showToast("Link copied to clipboard!"))
                    .catch(() => copyViaTextarea(window.location.href));
            } else {
                copyViaTextarea(window.location.href);
            }
        }

        function copyViaTextarea(text) {
            const textarea = document.createElement("textarea");
            textarea.value = text;
            textarea.style.position = "fixed";
            textarea.style.top = "-9999px";
            textarea.style.opacity = "0";
            document.body.appendChild(textarea);
            textarea.focus();
            textarea.select();
            try {
                document.execCommand("copy");
                showToast("Link copied to clipboard!");
            } catch (e) {
                showToast("Failed to copy link");
            }
            document.body.removeChild(textarea);
        }

        // 4. Cross-Platform App Deep Linking
        function openDeepLink(appUri, webUrl, e) {
            if (e) e.preventDefault();

            const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
            if (!isMobile) {
                window.open(webUrl, '_blank', 'noopener,noreferrer');
                return;
            }

            let appOpened = false;
            const onVisibilityChange = () => {
                if (document.hidden) {
                    appOpened = true;
                }
            };
            document.addEventListener('visibilitychange', onVisibilityChange, { once: true });

            window.location.href = appUri;

            setTimeout(() => {
                document.removeEventListener('visibilitychange', onVisibilityChange);
                if (!appOpened && !document.hidden) {
                    window.location.href = webUrl;
                }
            }, 1500);
        }

                // Throttle max active flakes to prevent overhead on lower-end mobile devices
                if (container.childElementCount > 35) return;

                const flake = document.createElement('div');
                flake.className = 'snowflake';

                // Particle size: 16px to 32px (clearly visible snowflakes with crystalline branches)
                const size = Math.floor(Math.random() * 16 + 16);
                // Starting horizontal position
                const startLeft = (Math.random() * 100).toFixed(2);
                // Animation duration: 6s to 11s for a relaxed winter drift
                const duration = (Math.random() * 5 + 6).toFixed(2);
                // Drift and sway offsets
                const swayX = ((Math.random() - 0.5) * 44).toFixed(1);
                const driftX = ((Math.random() - 0.5) * 60).toFixed(1);
                // Rotation angles during descent
                const rotMid = Math.floor((Math.random() - 0.5) * 160);
                const rotEnd = Math.floor((Math.random() - 0.5) * 360);
                // Shimmering ice opacity
                const opacity = (Math.random() * 0.35 + 0.45).toFixed(2);

                flake.style.width = `${size}px`;
                flake.style.height = `${size}px`;
                flake.style.left = `${startLeft}%`;
                flake.style.animationDuration = `${duration}s`;
                flake.style.setProperty('--sway-x', `${swayX}px`);
                flake.style.setProperty('--drift-x', `${driftX}px`);
                flake.style.setProperty('--rot-mid', `${rotMid}deg`);
                flake.style.setProperty('--rot-end', `${rotEnd}deg`);
                flake.style.opacity = opacity;

                // Alternate between solid and outlined crystalline snowflake geometry
                const path = Math.random() > 0.45 ? dSolid : dReg;
                flake.innerHTML = `<svg viewBox="0 0 448 512" aria-hidden="true"><path d="${path}"/></svg>`;

                container.appendChild(flake);

                // Safe cleanup once fallen to prevent DOM memory leaks
                setTimeout(() => {
                    if (flake.parentNode === container) {
                        container.removeChild(flake);
                    }
                }, parseFloat(duration) * 1000 + 200);
            }

            // Staggered initial spawn
            for (let i = 0; i < 14; i++) {
                setTimeout(createSnowflake, i * 220);
            }

            // Continuous peaceful snowfall interval
            setInterval(createSnowflake, 450);
        })();
    </script>
</body>
</html>
